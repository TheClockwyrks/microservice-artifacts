# The workspace of the microservice-artifacts repository. Every crate under crates/ is a
# member; add a crate by adding its directory.
[workspace]
# The resolver of edition 2024, the monorepo's, so a crate resolves the same
# features and the same MSRV-aware versions on both sides of an extraction.
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.0.0"
license = "MIT"
repository = "https://github.com/TheClockwyrks/microservice-artifacts"
# A crate of The Test Cabinet is consumed by its git source, never from
# crates.io, so none is published; a member says `publish.workspace = true`, and
# Cargo refuses that key when the root holds none to inherit.
publish = false

# Warnings-as-errors, baked into the manifests for every member crate that
# opts in with `[lints] workspace = true`, so a plain `cargo build` enforces
# the policy the clippy gate enforces on the command line.
[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = "deny"

# The crates of the other repositories this one may depend on, each at its
# public source, the GitHub mirror, and the tag its dependents pin. The
# superrepo's .cargo/config.toml redirects every one of these to the sibling
# checkout, so a build inside the superrepo never fetches them. A manifest
# never names an Azure URL or a path outside the repository: the
# dependency-edges gate refuses both.
[workspace.dependencies]
test-cabinet-contracts = { git = "https://github.com/TheClockwyrks/contracts", tag = "v0.2.3" }
test-cabinet-suites = { git = "https://github.com/TheClockwyrks/contracts", tag = "v0.2.3" }
test-cabinet-telemetry = { git = "https://github.com/TheClockwyrks/contracts", tag = "v0.2.3" }

# The third-party crates the members share, at the requirements the superrepo
# holds the same crates to, so a service resolves the versions its peers do.
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
bytes = "1"
dotenvy = "0.15"
# Default features keep the pure-Rust `miniz_oxide` backend: no zlib, so no
# system dependency.
flate2 = "1"
futures-util = "0.3"
getrandom = "0.3"
hex = "0.4"
hmac = "0.12"
http = "1"
# RS256 through the pure-Rust `rust_crypto` backend, so the portable musl build
# needs no C toolchain; no PEM parsing, since the keys arrive as JWK components.
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
opentelemetry = "0.32"
percent-encoding = "2"
# TLS through rustls so the image needs no system OpenSSL; `json` for the
# backend's bodies, `stream` to relay object bodies.
reqwest = { version = "0.12", default-features = false, features = [
	"json",
	"rustls-tls",
	"stream",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = "0.5"
tower-http = { version = "0.6", features = [
	"trace",
	"limit",
	"cors",
	"compression-gzip",
] }
tracing = "0.1"
